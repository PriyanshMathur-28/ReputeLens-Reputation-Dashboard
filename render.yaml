# render.yaml - ReputeLens Render Blueprint
# Deploys one Web Service: builds frontend + backend, serves from Node.js

services:
  - type: web
    name: reputelens
    runtime: node
    region: oregon

    buildCommand: |
      npm install -g pnpm@10.33.0
      pnpm install --frozen-lockfile
      pnpm --filter @workspace/reputelens build
      pnpm --filter @workspace/api-server build

    startCommand: node artifacts/api-server/dist/index.mjs

    healthCheckPath: /api/system/status

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
